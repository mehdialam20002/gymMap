# A-25 · Dependency scanning — NFR-SEC-07, NFR-SEC-08
#
# Note the interaction with the STACK_ADDITIONS.md standing rule: Dependabot may
# only ever *update* an already-approved dependency. It can never introduce one.
# A PR that adds a new transitive top-level dependency is reviewed as an
# addition, not merged as a bump.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: ["dependencies", "security"]
    commit-message:
      # Matches commitlint's INFRASTRUCTURAL_SCOPES allowlist, so Dependabot's
      # commits pass the PRD-identifier rule without an exemption.
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR per ecosystem cluster rather than per package: a Prisma bump that
      # arrives split across four PRs gets merged in the wrong order.
      typescript-tooling:
        patterns: ["typescript", "@types/*", "tsx", "tsup"]
      linting:
        patterns: ["eslint*", "@typescript-eslint/*", "prettier*", "dependency-cruiser"]
      testing:
        patterns: ["jest*", "@jest/*", "supertest", "@playwright/*", "playwright", "testcontainers"]
      nest:
        patterns: ["@nestjs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
    ignore:
      # TypeScript 7 removed the public compiler API, which `nest build`
      # consumes. Held until NestJS publishes a supported path.
      # See docs/setup/INSTALLATION_REPORT.md.
      - dependency-name: typescript
        versions: ["7.x"]

      # ── The locked stack: MAJOR bumps only. Minors and patches still flow. ──
      #
      # STACK_ADDITIONS.md Part 1: "Substitution = forbidden." A major version of
      # a locked selection IS a substitution — Next 14 -> 16 is not the same
      # framework, and the comment at the top of this file ("Dependabot may only
      # ever *update* an already-approved dependency") did not previously say so
      # in a way Dependabot could read.
      #
      # It opened `chore(deps): Bump next from 14.2.35 to 16.3.0` on the day this
      # repository went public. The build failed on
      # `app/layout.tsx: Property 'get' does not exist on type
      # 'Promise<ReadonlyHeaders>'` — Next 15 made `headers()` async — which is a
      # clear signal and an expensive way to receive it.
      #
      # These are ignored for MAJORS ONLY. A security patch on 14.x still opens a
      # PR, which is the whole point of A-25 and NFR-SEC-07. Raising any of these
      # majors is an owner decision under STACK_ADDITIONS.md, recorded in
      # DECISION_LOG.md, and then this row is removed in the same change.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: zod
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /infra/compose
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels: ["dependencies", "infrastructure"]
    commit-message:
      prefix: "chore(deps)"
