# M-007 · The ten always-on gates. CI_CD.md §4.3.
#
# TEN of the twenty-six jobs are wired here — the ten that can assert something real today.
# Jobs 7 (unit), 8-10 (api-gates, api-absence-assertions, openapi-drift), 11 (migration-safety),
# 12 (integration), 13 (isolation), 14 (contract), 17 (scan-sast), 21 (bac06-report) and 22
# (docs-traceability) arrive with the milestone that first gives them something to check, and
# the browser-surface jobs 18, 19 and 24 with the front-end band.
#
# Wiring a job with nothing to assert produces a green check that means nothing, which is worse
# than an absent one: it is a claim of coverage that no one has to defend.
#
# BRANCH PROTECTION NAMES EXACTLY ONE CHECK: `gate-summary`. That is deliberate and it is also
# the rollback plan — every future job is added without touching branch protection, and a
# reverted job cannot leave a required check permanently pending.

name: pr

on:
  pull_request:
    branches: [main, develop]
  merge_group:

# A new push supersedes the previous run on the same PR. Without this, a branch pushed five
# times holds five runners for work whose answer is already stale.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege by default. A job needing more says so locally (CI_CD.md §2.5).
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1 · setup — install once, publish the affected graph (AC-8)
  # ═══════════════════════════════════════════════════════════════════════════
  setup:
    name: 1 · setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      affected: ${{ steps.workspace.outputs.affected }}
    steps:
      - id: workspace
        uses: ./.github/actions/setup-workspace

  # ═══════════════════════════════════════════════════════════════════════════
  # 2 · commit-grammar — every commit cites a PRD identifier
  #
  # Constitution §20.3. Not bureaucracy: `git log --grep=FR-CHK-04` is how anyone answers
  # "why is this code like this" two years from now, and it only works if the link was made
  # at commit time. Nothing reconstructs it later.
  # ═══════════════════════════════════════════════════════════════════════════
  commit-grammar:
    name: 2 · commit-grammar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: ./.github/actions/setup-workspace
        with:
          fetch-depth: "0" # needs history to read the range

      - name: Conventional Commits
        run: |
          pnpm exec commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

      - name: Every commit cites a PRD identifier
        run: |
          set -euo pipefail
          PATTERN='(FR|BR|NFR|AC|US|EP|E2E|BAC|KPI|OBJ|SCR|API|RSK|TD|ADR|M)-[A-Z0-9]+'
          FAILED=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            MESSAGE="$(git log -1 --format='%B' "$sha")"
            if ! printf '%s' "$MESSAGE" | grep -Eq "$PATTERN"; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") cites no PRD identifier."
              echo "  Put it in the scope — feat(FR-CHK-04): … — or in a Refs: footer."
              FAILED=1
            fi
          done < <(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          exit $FAILED

  # ═══════════════════════════════════════════════════════════════════════════
  # 3 · lint — warnings are errors, and suppressions must be justified (AC-4)
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: 3 · lint
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-workspace

      - name: Formatting
        run: pnpm format:check

      - name: ESLint — zero warnings
        # A warning nobody must fix is a warning everybody ignores, and the count only grows.
        run: pnpm lint -- --max-warnings=0

      - name: An eslint-disable must cite a DECISION_LOG entry
        run: |
          set -euo pipefail
          # A rule suppressed without a recorded reason is a rule that was inconvenient once.
          # The reference is what lets a reviewer distinguish "we thought about this" from
          # "the build was red and I was in a hurry".
          MATCHES="$(grep -rn --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.cjs' \
            -E 'eslint-disable(-next-line|-line)?' apps packages 2>/dev/null \
            | grep -vE 'ADR-[0-9]{4}|DECISION_LOG|TD-[0-9]{3}' || true)"
          if [ -n "$MATCHES" ]; then
            echo "::error::eslint-disable without an ADR-NNNN, TD-NNN or DECISION_LOG reference:"
            echo "$MATCHES"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # 4 · typecheck
  # ═══════════════════════════════════════════════════════════════════════════
  typecheck:
    name: 4 · typecheck
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck

  # ═══════════════════════════════════════════════════════════════════════════
  # 5 · architecture — the FULL rule set, never cached, never affected-filtered (AC-3)
  #
  # A boundary is a property of the whole graph. An affected filter would miss a violation
  # introduced by a file that is not itself in the diff — which is most of them, because the
  # edge that breaks a boundary usually lives at the far end.
  # ═══════════════════════════════════════════════════════════════════════════
  architecture:
    name: 5 · architecture
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-workspace

      - name: dependency-cruiser — full graph
        run: pnpm exec depcruise --config .dependency-cruiser.cjs apps packages --output-type err

      # M-014 AC-7. `no-platform-prisma-outside-allowlist` above answers "MAY this module cross
      # the boundary". It cannot answer "how many places DO, and did that grow this quarter" —
      # once `admin/` is on the allow-list, its fortieth cross-tenant read passes every gate.
      # The committed inventory puts the total in the diff, where a reviewer sees it.
      - name: elevation-inventory — every cross-tenant read, diffed
        run: pnpm ci:elevation-inventory

      # SeedStrategy.md §2.7. `migration-lint`'s RD3 rule checks WHICH TABLES a migration may write
      # rows into; it says nothing about which rows, so a hand-edited migration that changes
      # India's financial-year start from 4 to 1 passes every other gate here. This hashes each of
      # the sixteen reference tables against a committed manifest.
      #
      # It SKIPS with exit 0 and a loud line when no database is reachable — this job has no
      # Postgres service, so today it is the manifest's own consistency that is checked in CI and
      # the hashes that are checked locally and by the nightly production read (§2.7). Wiring the
      # service is TD-039's job, not this step's.
      - name: reference-data-drift — the sixteen tables, hashed against the manifest
        run: pnpm ci:reference-drift

      - name: Publish the module graph
        if: always()
        run: |
          pnpm exec depcruise --config .dependency-cruiser.cjs apps packages \
            --output-type json > dependency-graph.json

      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        if: always()
        with:
          name: module-graph
          path: dependency-graph.json
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # 6 · module-structure — exactly 23 modules, §8.3 READMEs, no forbidden directories (AC-5)
  # ═══════════════════════════════════════════════════════════════════════════
  module-structure:
    name: 6 · module-structure
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: ./.github/actions/setup-workspace
      - run: node packages/config/scripts/module-structure.mjs
      - name: The validator's own tests
        run: node --test packages/config/scripts/module-structure.spec.mjs

  # ═══════════════════════════════════════════════════════════════════════════
  # 15 · scan-deps — no unapproved dependency, no known vulnerability
  # ═══════════════════════════════════════════════════════════════════════════
  scan-deps:
    name: 15 · scan-deps
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-workspace

      - name: Audit
        run: pnpm audit --audit-level=high --prod

      - name: R1a — the root package.json declares no runtime dependencies
        run: |
          # FolderStructure R1a. The root is a workspace coordinator; a dependency there is
          # hoisted into every package's resolution and becomes a phantom import nobody declared.
          node -e "
            const pkg = require('./package.json');
            if (pkg.dependencies && Object.keys(pkg.dependencies).length) {
              console.error('::error::Root package.json has a dependencies block (R1a):',
                Object.keys(pkg.dependencies).join(', '));
              process.exit(1);
            }
          "

      - name: Every dependency has an approved A-NN row
        run: |
          set -euo pipefail
          # STACK_ADDITIONS.md standing rule: a dependency with no approved row is a review
          # blocker. Substitution is forbidden; addition requires the owner's approval FIRST.
          # Reported, not enforced, until M-008 — the allow-list needs the full manifest to be
          # accurate, and a false red here would train people to ignore this job.
          node packages/config/scripts/dependency-approval.mjs || {
            echo "::warning::Unapproved dependencies detected — see STACK_ADDITIONS.md"
          }

  # ═══════════════════════════════════════════════════════════════════════════
  # 16 · scan-secrets — Gitleaks over the full history of the PR range
  # ═══════════════════════════════════════════════════════════════════════════
  scan-secrets:
    name: 16 · scan-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # a secret added and then removed is still in the history

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  # ═══════════════════════════════════════════════════════════════════════════
  # 25 · pipeline-integrity — the pipeline checks itself (AC-6, AC-7)
  # ═══════════════════════════════════════════════════════════════════════════
  pipeline-integrity:
    name: 25 · pipeline-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-workspace

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: AC-7 — every third-party action is pinned by commit SHA
        run: node packages/config/scripts/actions-pinned.mjs

      - name: AC-6 — no floating image tag in compose
        run: node --test apps/server/test/compose-contract.spec.ts

      - name: terraform validate
        # AC-6 requires this to pass against infra/terraform/, which is EMPTY at this point and
        # must therefore pass with no special case. An `if: exists()` guard here would be a
        # special case that silently keeps passing after the directory has real content.
        run: |
          set -euo pipefail
          if ! command -v terraform >/dev/null 2>&1; then
            curl -fsSL https://releases.hashicorp.com/terraform/1.10.3/terraform_1.10.3_linux_amd64.zip -o tf.zip
            unzip -q tf.zip && sudo mv terraform /usr/local/bin/
          fi
          # `globstar` as well as `nullglob`. Without it bash does not expand `**` recursively —
          # `infra/terraform/**/` degrades to a single level, so `modules/object-storage/` would
          # never be visited and the job would stay green over unvalidated HCL. Found while the
          # directory was still empty, which is the only time a gate like this can be fixed
          # without also discovering what it had been missing.
          shopt -s nullglob globstar

          # Directories holding at least one .tf file, rather than every directory. `terraform
          # -chdir` on a directory with no configuration is an error, and the old `echo "$dir"*.tf`
          # test was always non-empty — an unmatched glob echoes itself — so `continue` never fired.
          MODULES=()
          for tf in infra/terraform/**/*.tf; do
            dir="${tf%/*}"
            case " ${MODULES[*]} " in *" $dir "*) ;; *) MODULES+=("$dir") ;; esac
          done

          if [ ${#MODULES[@]} -eq 0 ]; then
            echo "infra/terraform/ has no modules yet — nothing to validate, and that is a pass."
          else
            for dir in "${MODULES[@]}"; do
              echo "validating $dir"
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate
            done
          fi

      - name: IaC misconfiguration scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: config
          scan-ref: infra/
          exit-code: "1"
          severity: HIGH,CRITICAL

  # ═══════════════════════════════════════════════════════════════════════════
  # 8 · api-gates — PG-1, PG-2, PG-3, PG-5 and the closed audience-prefix set
  # ═══════════════════════════════════════════════════════════════════════════
  api-gates:
    name: 8 · api-gates
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-workspace

      - name: Regenerate the contract
        # No secrets required. openapi:emit fills unset variables with visibly fake
        # placeholders, so the contract is generatable on a runner that holds nothing —
        # which is the only way this job can run on every PR from a fork.
        run: pnpm --filter @gymmap/server openapi:emit

      - run: node packages/config/scripts/api-gates.mjs

      - name: The gates' own fixtures
        # With zero real endpoints these gates pass on the live document, which is exactly
        # when one is most likely to be inert. The fixtures prove each bites regardless.
        run: node --test packages/config/scripts/api-gates.spec.mjs

  # ═══════════════════════════════════════════════════════════════════════════
  # 9 · api-absence-assertions — four proofs that an operation does NOT exist
  # ═══════════════════════════════════════════════════════════════════════════
  api-absence-assertions:
    name: 9 · api-absence-assertions
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @gymmap/server openapi:emit
      - run: node packages/config/scripts/api-absence-assertions.mjs

  # ═══════════════════════════════════════════════════════════════════════════
  # 10 · openapi-drift — the committed artefact must match a fresh generation
  #
  # NFR-MNT-03. The diff is rendered into the job summary as a MANDATORY review item:
  # a contract change nobody looked at is a breaking change nobody agreed to.
  # ═══════════════════════════════════════════════════════════════════════════
  openapi-drift:
    name: 10 · openapi-drift
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @gymmap/server openapi:emit

      - name: Compare against the committed artefact
        run: |
          set -euo pipefail
          if git diff --quiet -- openapi.json; then
            echo 'openapi.json matches the code.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### API contract changed — REVIEW REQUIRED'
            echo ''
            echo 'The generated document differs from the committed one. That is not'
            echo 'automatically wrong, but it is never incidental: it changes what every'
            echo 'client is generated from, and §C3.1 gives breaking changes a six-month'
            echo 'deprecation obligation.'
            echo ''
            echo '```diff'
            git diff -- openapi.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error::openapi.json is out of date. Run: pnpm --filter @gymmap/server openapi:emit'
          exit 1

  # ═══════════════════════════════════════════════════════════════════════════
  # 14 · contract — request AND response validation against the document
  # ═══════════════════════════════════════════════════════════════════════════
  contract:
    name: 14 · contract
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @gymmap/server openapi:emit

      - name: Validate every route against the contract
        run: |
          set -euo pipefail
          COUNT="$(node packages/config/scripts/count-operations.mjs)"
          if [ "$COUNT" -eq 0 ]; then
            # AC-7: explicit, never silent. A zero-route pass and a full pass must not look
            # identical in a log, or nobody notices the suite quietly stopped covering
            # anything. The Supertest half arrives with the first endpoint milestone.
            echo "contract: 0 routes validated — no endpoints exist yet."
            echo '### contract: **0 routes validated** (no endpoints exist yet)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### contract: validating $COUNT route(s)" >> "$GITHUB_STEP_SUMMARY"
          pnpm --filter @gymmap/server test:contract

  # ═══════════════════════════════════════════════════════════════════════════
  # 13 · isolation — BAC-10. NEVER cached, never affected-filtered, never waived.
  #
  # CI_CD.md §0.5 marks invariant I1 UNWAIVABLE: a failing isolation gate is never re-run "to
  # see if it passes" and never waived. §3.6 is equally plain that removing this job from the
  # critical path "is not a lever; it is the failure the pipeline exists to prevent".
  #
  # TURBO_FORCE is set because a CACHED isolation result is a result from a DIFFERENT COMMIT.
  # A gate that reports a cache hit is a gate that did not run — and it reports success.
  # `isolation-coverage` fails on IG-5 if this env var is ever removed.
  # ═══════════════════════════════════════════════════════════════════════════
  isolation:
    name: 13 · isolation
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 20
    env:
      TURBO_FORCE: "true"
    services:
      postgres:
        # The SAME digest as infra/compose/compose.yaml. Two different PostGIS builds between
        # local and CI is how "it passes on my machine" becomes an isolation question, and this
        # is the one suite where that ambiguity is unaffordable.
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gymmap
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: ./.github/actions/setup-workspace

      # IG-1 … IG-6 BEFORE the suite. A route with no case group must fail here, where the
      # message names the route, rather than as an absent test nobody looks for.
      - name: isolation-coverage — every tenant-scoped route has a case group
        run: pnpm ci:isolation-coverage >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations and seed
        run: pnpm --filter @gymmap/server db:setup

      - name: Build the server, so the suite drives the real application
        run: pnpm --filter @gymmap/server build

      # A1 … A6 per route, plus A7's negative control. A7 DISABLES row-level security and
      # requires the subset to fail: if it passes, the suite is not exercising the policy and
      # every other assertion here is unfalsifiable.
      - name: The suite
        run: pnpm --filter @gymmap/server test:isolation

  # ═══════════════════════════════════════════════════════════════════════════
  # 26 · gate-summary — THE ONLY CHECK BRANCH PROTECTION NAMES (AC-1)
  # ═══════════════════════════════════════════════════════════════════════════
  gate-summary:
    name: 26 · gate-summary
    runs-on: ubuntu-latest
    # `always()` so this still runs when an upstream job fails; without it the required check
    # would sit "pending" forever on a red PR and nobody could tell a failure from a hang.
    if: always()
    needs:
      - setup
      - commit-grammar
      - lint
      - typecheck
      - architecture
      - module-structure
      - api-gates
      - api-absence-assertions
      - openapi-drift
      - contract
      - isolation
      - scan-deps
      - scan-secrets
      - pipeline-integrity
    timeout-minutes: 5
    steps:
      - name: Summarise and enforce
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "### Gate summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :-- | :-- |" >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          while IFS=$'\t' read -r job result; do
            case "$result" in
              success)  icon="PASS" ;;
              # `skipped` is legitimate only when a job was filtered out; it is NOT a pass and
              # is reported as such, so a mis-filtered job cannot hide behind a green summary.
              skipped)  icon="SKIPPED" ;;
              *)        icon="FAIL"; FAILED=1 ;;
            esac
            echo "| \`$job\` | $icon ($result) |" >> "$GITHUB_STEP_SUMMARY"
          done < <(printf '%s' "$RESULTS" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const n=JSON.parse(d);
              for (const [k,v] of Object.entries(n)) console.log(k+'\t'+v.result);
            })")

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" -ne 0 ]; then
            echo "**One or more gates failed.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "**All gates green.**" >> "$GITHUB_STEP_SUMMARY"
