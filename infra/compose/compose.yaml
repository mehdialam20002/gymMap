# A-28 · Local development environment.
#
# Scope: Postgres 16 + PostGIS, Redis 7, MinIO (S3-compatible), Mailpit.
# Nothing here is a production topology — production uses managed Postgres and
# Redis on a managed orchestrator (§C1.1). This file exists so that a developer
# gets the same *behaviour* locally: PostGIS geometry, trigram search, a real
# S3 API, and a real SMTP sink.
#
#   pnpm infra:up      start everything, detached
#   pnpm infra:ps      health of each service
#   pnpm infra:logs    follow logs
#   pnpm infra:down    stop, keep data
#   pnpm infra:reset   stop and DESTROY volumes
#
# Credentials below are fixed, weak and local-only. They are allowlisted in
# .gitleaks.toml precisely because they must never be anything else. Nothing in
# this file reaches beyond the loopback interface.

name: gymmap

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS — the primary store (§C1.1)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    container_name: gymmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymmap
      # Deterministic collation. Index ordering must not depend on the host
      # locale, or a developer's ORDER BY disagrees with CI's.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymmap"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    command:
      # RLS is the single most important mechanism in this system (BR-TEN-01).
      # Logging every statement locally makes a missing SET LOCAL app.tenant_id
      # visible while developing rather than in an isolation test.
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=200
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB

  # ---------------------------------------------------------------------------
  # Redis 7 — cache, rate-limiter buckets (A-13), BullMQ queues (§C1.1)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: gymmap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    command:
      # BullMQ requires eviction to be disabled: an evicted job key is a
      # silently lost job. `noeviction` makes memory pressure an error instead.
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      # M-005 AC-2 · THREE logical databases, matching the Terraform module's
      # split (infra/terraform/modules/redis):
      #
      #     db 0  cache      FLUSHDB-able at any time; nothing here is durable
      #     db 1  queue      BullMQ. Losing this loses accepted, unrun jobs
      #     db 2  ratelimit  rate-limiter-flexible counters (A-13)
      #
      # Capped at exactly 3 rather than the default 16 so that reaching for
      # `db 7` fails immediately instead of creating a fourth namespace nobody
      # provisioned in Terraform. The separation is the point: `FLUSHDB` on the
      # cache during debugging must not be able to delete a queue, and it
      # cannot if the two are different databases.
      - --databases
      - "3"

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (A-18, §C1.1)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    container_name: gymmap-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command: server /data --console-address ":9001"

  # ---------------------------------------------------------------------------
  # Bucket creation — one-shot, exits 0
  #
  # Two buckets because they have different lifecycles: gym media is public-read
  # via CDN, KYC documents are private and access-logged (FR-GYM-02, Epic_03).
  #
  # M-005 AC-3 · The `kyc` bucket's private status is asserted EXPLICITLY and
  # then VERIFIED, not left to MinIO's default. BR-DAT-07 puts KYC documents —
  # PAN, Aadhaar, bank proofs, the owner's photo ID — in a segregated bucket
  # with every access logged. "Private by default" is true today and is one
  # upstream release note away from not being true, and the failure is silent:
  # the bucket serves anonymously and nothing anywhere reports it. So the
  # policy is set, then read back, and bring-up FAILS if it is not `none`.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    container_name: gymmap-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/gymmap-media
        mc mb --ignore-existing local/gymmap-kyc

        # Gym photos are served publicly through the CDN.
        mc anonymous set download local/gymmap-media

        # BR-DAT-07 — KYC is private. Stated, not assumed.
        mc anonymous set none local/gymmap-kyc

        # ...and verified. `mc anonymous get` prints the effective policy; if it
        # is anything but `none`, bring-up fails here rather than serving
        # someone's Aadhaar card to an unauthenticated GET.
        KYC_POLICY="$$(mc anonymous get local/gymmap-kyc)"
        case "$$KYC_POLICY" in
          *none*) ;;
          *)
            echo "FATAL: the kyc bucket is not private. Effective policy: $$KYC_POLICY" >&2
            echo "BR-DAT-07 requires KYC documents to be unreachable anonymously." >&2
            exit 1
            ;;
        esac

        echo "buckets ready: gymmap-media (public-read), gymmap-kyc (private, verified)"
    restart: "no"

  # ---------------------------------------------------------------------------
  # Mailpit — SMTP sink + web UI. No mail leaves the machine (A-19 is deferred,
  # so there is no real provider to leak to).
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    container_name: gymmap-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      TZ: Asia/Kolkata
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI  → http://localhost:8025
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:
