<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GYM MAP">
  <!--
    The tab mark. `app/icon.svg` is the App Router convention: Next serves it and emits the
    <link rel="icon"> itself, which is why no manual tag exists in layout.tsx — and why the
    browser stopped requesting /favicon.ico and logging a 404 on every page load.

    Deliberately NOT theme-aware. A favicon is composited on the browser's tab strip, not on our
    page, and that strip follows the OS theme independently of the site — so a mark that flips with
    `prefers-color-scheme` would go invisible against whichever strip disagreed. A filled disc in
    the brand red carries its own contrast on both.

    #E21B2D is the brand fill from globals.css, where white on it is measured at 4.74:1.
  -->
  <circle cx="16" cy="16" r="16" fill="#e21b2d" />
  <text
    x="16"
    y="16"
    fill="#ffffff"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="20"
    font-weight="700"
    text-anchor="middle"
    dominant-baseline="central"
  >G</text>
</svg>
