# A-05 · docs/engineering/FolderStructure.md §3.1
#
# Two globs, no more. A third glob is how a `tools/` or `scripts/` directory
# appears without an amendment under constitution §24.
packages:
  - "apps/*"
  - "packages/*"

# A-25 supply-chain posture. An install script is arbitrary code execution at install
# time, so the default is 'no' and every exception is listed here with a reason.
# @nestjs/core's postinstall only prints a support message - nothing needs it to run.
allowBuilds:
  "@nestjs/core": false

  # A-01, A-07 · Prisma. These three are `true` because Prisma's postinstall downloads the
  # query-engine binary for the host platform and generates the typed client. Without it
  # `prisma migrate` and `PrismaClient` do not exist — this is not telemetry or a nag banner,
  # it is the package's actual installation.
  #
  # The engines are integrity-checked against the lockfile, and A-01 was approved with the
  # tenant-context extension as its condition (ADR-0005) — that condition is enforced in code
  # by the `no-raw-prisma-outside-tenancy` dependency-cruiser rule, not by blocking the install.
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true

  # Arrived transitively with @nestjs/swagger. Scarf's postinstall reports an install ping to a
  # third party. Nothing depends on it running, and NFR-PRV-* plus the DPDP Act posture make a
  # silent outbound call at install time exactly the kind of thing that should be opted into
  # rather than out of.
  "@scarf/scarf": false

  # Vite's bundler (A-06 test stack, and Part 1's locked choice for both dashboards). Same
  # category as the Prisma engines above: the postinstall resolves the platform-specific native
  # binary that IS the package. Without it `vite build` cannot run at all — this is the
  # package's actual installation, not telemetry and not a nag banner. The binary's integrity is
  # pinned by the lockfile.
  esbuild: true

  # A-12 · Argon2id, the password hasher (`FR-AUTH-04`, `NFR-SEC-01`). M-020.
  #
  # `true`, and this one deserves more than a line. `argon2` is a native binding: its install
  # script fetches the prebuilt `.node` for the host platform, or compiles it. Without that the
  # module does not load at all — this is the package's installation, not telemetry.
  #
  # It is also the single most security-sensitive dependency in the tree. A compromised install
  # script here does not leak an install ping; it sees every password on the way to being
  # hashed. That argues for scrutiny, not for `false` — `false` does not sandbox the package,
  # it only stops it working, and the runtime code would still be loaded either way.
  #
  # What actually bounds the risk: the tarball's integrity is pinned in `pnpm-lock.yaml`, the
  # lockfile is supply-chain-verified on every install, and `argon2.hasher.adapter.spec.ts`
  # asserts the recorded A-12 parameters on every test run — so a substituted implementation
  # that quietly weakened them fails the build rather than shipping.
  argon2: true
